<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Categorías</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="home.html">🏫 Instituto N°57</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item nav-button">
                    <a class="btn btn-primary me-2" href="index.html">Gestión de Estudiantes</a>
                </li>
                <li class="nav-item nav-button">
                    <a class="btn btn-primary me-2" href="carrera.html">Gestión de Carreras</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="mb-4">📂 Gestión de Categorías de Carreras</h1>

    <!-- Añadir categoría -->
    <section class="section-card mb-4">
        <h2 class="text-success">➕ Añadir nueva categoría</h2>
        <div class="input-group mb-2">
            <input type="text" id="newCategory" class="form-control" placeholder="Nombre de la categoría">
            <button class="btn btn-primary" id="addCategoryBtn">Añadir</button>
        </div>
        <div id="addCategoryMsg"></div>
    </section>

    <!-- Eliminar categoría -->
    <section class="section-card mb-4">
        <h2 class="text-danger">❌ Eliminar categoría</h2>
        <select id="deleteCategorySelect" class="form-control mb-2"></select>
        <button class="btn btn-danger" id="deleteCategoryBtn">Eliminar Categoría</button>
        <div id="deleteCategoryResult" class="mt-2"></div>
    </section>

    <section class="section-card mb-4">
        <h2 class="text-info">🔎 Buscar categoría por ID</h2>
        <div class="input-group mb-2">
            <input type="number" id="categoryIdSearch" class="form-control" placeholder="ID de la categoría">
            <button class="btn btn-info" id="searchCategoryByIdBtn">Buscar</button>
        </div>
        <div id="categorySearchResult"></div>
    </section>

    <!-- Ver todas las categorías -->
    <section class="section-card mb-4">
    <h2 class="text-primary">📋 Todas las categorías registradas</h2>
    <button class="btn btn-info mb-3" id="showAllCategoriesBtn">Mostrar Todas</button>
    <div id="allCategoriesList"></div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
