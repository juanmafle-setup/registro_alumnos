<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Categorías</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="home.html">🏫 Instituto N°57</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item nav-button">
                    <a class="btn btn-primary me-2" href="index.html">Gestión de Estudiantes</a>
                </li>
                <li class="nav-item nav-button">
                    <a class="btn btn-primary me-2" href="carrera.html">Gestión de Carreras</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="mb-4">📂 Gestión de Categorías de Carreras</h1>

    <!-- Añadir categoría -->
    <section class="section-card mb-4">
        <h2 class="text-success">➕ Añadir nueva categoría</h2>
        <div class="input-group mb-2">
            <input type="text" id="newCategory" class="form-control" placeholder="Nombre de la categoría">
            <button class="btn btn-primary" onclick="addCategory()">Añadir</button>
        </div>
        <div id="addCategoryMsg"></div>
    </section>

    <!-- Eliminar categoría -->
    <section class="section-card mb-4">
        <h2 class="text-danger">❌ Eliminar categoría</h2>
        <select id="deleteCategorySelect" class="form-control mb-2"></select>
        <button class="btn btn-danger" onclick="deleteCategory()">Eliminar Categoría</button>
        <div id="deleteCategoryResult" class="mt-2"></div>
    </section>

    <section class="section-card mb-4">
        <h2 class="text-info">🔎 Buscar categoría por ID</h2>
        <div class="input-group mb-2">
        <input type="number" id="categoryIdSearch" class="form-control" placeholder="ID de la categoría">
        <button class="btn btn-info" onclick="searchCategoryById()">Buscar</button>
        </div>
        <div id="categorySearchResult"></div>
    </section>

    <!-- Ver todas las categorías -->
    <section class="section-card mb-4">
        <h2 class="text-primary">📋 Todas las categorías registradas</h2>
        <div id="allCategoriesList"></div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
    // Mostrar todas las categorías
    async function showAllCategories() {
        try {
            const categories = await getAllCategoriesService();
            const container = document.getElementById("allCategoriesList");
            if (!categories || categories.length === 0) {
                container.innerHTML = '<div class="alert alert-info">No hay categorías registradas.</div>';
                return;
            }
            let html = '<ul class="list-group">';
            categories.forEach(cat => {
                html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                            <span>${cat.name}</span>
                            <span class="badge bg-primary rounded-pill">ID: ${cat.id}</span>
                         </li>`;
            });
            html += '</ul>';
            container.innerHTML = html;
        } catch (error) {
            document.getElementById("allCategoriesList").innerHTML = '<div class="alert alert-danger">Error al cargar categorías.</div>';
            console.error("Error al mostrar categorías:", error);
        }
    }

    // Cargar categorías para eliminar y mostrar lista
    async function loadCategoriesForDelete() {
        const select = document.getElementById('deleteCategorySelect');
        if (select) {
            try {
                const categories = await getAllCategoriesService();
                select.innerHTML = '<option value="">Seleccione una categoría</option>';
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;
                    select.appendChild(option);
                });
                showAllCategories();
            } catch (error) {
                console.error('Error al cargar categorías para eliminar:', error);
            }
        }
    }

    // Añadir categoría
    async function addCategory() {
        const name = document.getElementById("newCategory").value.trim();
        const msg = document.getElementById("addCategoryMsg");

        if (!name) {
            msg.innerHTML = '<div class="alert alert-danger">Debes ingresar un nombre de categoría.</div>';
            return;
        }

        try {
            const result = await registerCategoryService(name);
            if (result.error) {
                msg.innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
            } else {
                msg.innerHTML = '<div class="alert alert-success">Categoría añadida exitosamente.</div>';
                document.getElementById("newCategory").value = "";
                await loadCategoriesForDelete();
            }
        } catch (error) {
            msg.innerHTML = '<div class="alert alert-danger">Error al añadir categoría.</div>';
            console.error("Error al añadir categoría:", error);
        }
    }

    // Eliminar categoría
    async function deleteCategory() {
        const select = document.getElementById('deleteCategorySelect');
        const msg = document.getElementById('deleteCategoryResult');
        const id = select ? select.value : null;
        if (!id) {
            msg.innerHTML = '<div class="alert alert-danger">Seleccione una categoría para eliminar.</div>';
            return;
        }
        try {
            const result = await deleteCategoryService(id);
            if (result.error) {
                msg.innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
            } else {
                msg.innerHTML = '<div class="alert alert-success">Categoría eliminada exitosamente.</div>';
                await loadCategoriesForDelete();
            }
        } catch (error) {
            msg.innerHTML = '<div class="alert alert-danger">Error al eliminar categoría.</div>';
            console.error("Error al eliminar categoría:", error);
        }
    }

    // Inicialización
    document.addEventListener('DOMContentLoaded', () => {
        loadCategoriesForDelete();
        showAllCategories(); // <-- Esta línea asegura que siempre se muestre la lista
    });
</script>
</body>
</html>
