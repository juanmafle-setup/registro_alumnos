<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>📚 Gestión de Estudiantes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="home.html">🏫 Inicio
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item nav-button">
                    <a class="btn btn-primary me-2" href="carrera.html">Gestión de Carreras</a>
                </li>
                <li class="nav-item nav-button">
                    <a class="btn btn-primary me-2" href="categorias.html">Gestión de Categorías</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="mb-4 text-center">📚 Gestión de Estudiantes</h1>

    <!-- Registrar estudiante -->
    <section class="section-card mb-4">
        <h2>➕ Registrar Estudiante</h2>
        <div class="mb-3">
            <label for="registerName" class="form-label">Nombre del Estudiante</label>
            <input type="text" id="registerName" class="form-control" placeholder="Ej: Juan Pérez" required>
        </div>
        <div class="mb-3">
            <label for="careerFilterRegister" class="form-label">Carrera</label>
            <select id="careerFilterRegister" class="form-select"></select>
        </div>
        <button class="btn btn-success" onclick="registerStudent()">Registrar</button>
        <div id="registerResult" class="mt-3"></div>
    </section>

    <!-- Buscar estudiante por ID -->
    <section class="section-card mb-4">
        <h2>🔍 Buscar Estudiante por ID</h2>
        <div class="mb-3">
            <label for="studentId" class="form-label">ID del Estudiante</label>
            <input type="number" id="studentId" class="form-control" placeholder="Ej: 1">
        </div>
        <button class="btn btn-primary" onclick="getStudentById()">Buscar</button>
        <div id="getResult" class="mt-3"></div>
    </section>

    <!-- Buscar estudiantes por carrera -->
    <section class="section-card mb-4">
        <h2>🔎 Buscar Estudiantes por Carrera</h2>
        <div class="mb-3">
            <label for="careerFilterSearch" class="form-label">Carrera</label>
            <select id="careerFilterSearch" class="form-select"></select>
        </div>
        <button class="btn btn-primary" onclick="getStudentsByCareer()">Buscar</button>
        <div id="careerResult" class="mt-3"></div>
    </section>

    <!-- Eliminar estudiante -->
    <section class="section-card mb-4">
        <h2>❌ Eliminar Estudiante</h2>
        <div class="mb-3">
            <label for="deleteId" class="form-label">ID del Estudiante</label>
            <input type="number" id="deleteId" class="form-control" placeholder="Ej: 1">
        </div>
        <button class="btn btn-danger" onclick="deleteStudent()">Eliminar Estudiante</button>
        <div id="deleteResult" class="mt-3"></div>
    </section>

    <!-- Mostrar todos los estudiantes -->
    <section class="section-card mb-4">
        <h2>👀 Ver todos los estudiantes</h2>
        <button class="btn btn-info mb-3" onclick="showAllStudents()">Mostrar Todos</button>
        <div id="allStudentsResult"></div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
