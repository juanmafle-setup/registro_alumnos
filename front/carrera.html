<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>📚 Gestión de Carreras</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="home.html">🏫 Inicio</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item nav-button">
                <a class="btn btn-primary me-2" href="categorias.html">Gestión de Categorías</a>
            </li>
            <li class="nav-item nav-button">
                 <a class="btn btn-primary me-2" href="index.html">Gestión de Estudiantes</a>
            </li>
        </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
    <h1 class="mb-4">📚 Gestión de Carreras</h1>

    <!-- Añadir carrera -->
    <section class="section-card mb-4">
        <h2 class="text-success">➕ Añadir nueva carrera</h2>
        <div class="input-group mb-2">
            <input type="text" id="newCareer" class="form-control" placeholder="Nombre de la carrera">
            <select id="categorySelect" class="form-select" style="max-width:200px"></select>
            <button class="btn btn-primary" onclick="addCareer()">Añadir</button>
        </div>
        <div id="addCareerMsg"></div>
    </section>

    <!-- Buscar carrera por ID -->
    <section class="section-card mb-4">
        <h2 class="text-info">🔎 Buscar carrera por ID</h2>
        <div class="input-group mb-2">
        <input type="number" id="careerIdSearch" class="form-control" placeholder="ID de la carrera">
        <button class="btn btn-info" onclick="searchCareerById()">Buscar</button>
        </div>
    <div id="careerSearchResult"></div>
    </section>

    <!-- Eliminar carrera -->
    <section class="section-card mb-4">
        <h2 class="text-danger">❌ Eliminar carrera</h2>
        <select id="deleteCareerSelect" class="form-control mb-2"></select>
        <button class="btn btn-danger" onclick="deleteCareer()">Eliminar Carrera</button>
        <div id="deleteCareerResult" class="mt-2"></div>
    </section>

    <!-- Ver todas las carreras con su categoría -->
    <section class="mb-4">
        <h2 class="text-primary">👀 Ver todas las carreras y sus categorías</h2>
        <button class="btn btn-info mb-3" onclick="showAllCareers()">Mostrar Todas</button>
        <div id="allCareersResult"></div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
